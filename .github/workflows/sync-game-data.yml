name: Discover released game data

on:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: released-game-data-review
  cancel-in-progress: false

jobs:
  discover-and-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover official released version and immutable source revisions
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION=$(jq -r '.currentReleaseId as $id | .releases[] | select(.id == $id) | .gameVersion' public/data/releases/index.json)
          npx tsx scripts/game-data/discoverReleasedVersion.ts --current-version "$CURRENT_VERSION" --output /tmp/released-discovery.json
          STATUS=$(jq -r .status /tmp/released-discovery.json)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "candidate" ]; then
            echo "version=$(jq -r .gameVersion /tmp/released-discovery.json)" >> "$GITHUB_OUTPUT"
          fi
      - name: Exit cleanly when released version is unchanged
        if: steps.discover.outputs.status == 'no-change'
        run: echo "No newer official released version with matching immutable upstream revisions."
      - name: Stage immutable candidate evidence on a review branch
        if: steps.discover.outputs.status == 'candidate'
        env:
          VERSION: ${{ steps.discover.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          BRANCH="automation/review-released-${VERSION}-${RUN_ID}"
          git switch -c "$BRANCH"
          mkdir -p "data/release-candidates/${VERSION}"
          cp /tmp/released-discovery.json "data/release-candidates/${VERSION}/discovery.json"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"
      - name: Audit current branch before opening the manual release gate
        if: steps.discover.outputs.status == 'candidate'
        run: npm run check
      - name: Commit candidate evidence
        if: steps.discover.outputs.status == 'candidate'
        env:
          VERSION: ${{ steps.discover.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/release-candidates/${VERSION}/discovery.json"
          git commit -m "chore: review released ${VERSION} data"
          git push origin "HEAD:${branch}"
      - name: Open draft review PR
        if: steps.discover.outputs.status == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.discover.outputs.version }}
        run: |
          gh pr create --draft --base main --head "$branch" --title "chore: review released ${VERSION} game data" --label data-review --body "Official released-version evidence and immutable upstream revisions were discovered automatically. Maintainers must review checksums, entity diffs, role/effect overlays, complete candidate rebuild/audit, and release-index promotion. This workflow never updates main."
